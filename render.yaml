# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Backend only. The website (app/) is a static build hosted on Vercel --
# see app/vercel.json and the README's "Deploying your own copy".
#
# Lets Render provision the whole backend from one "New Blueprint" click:
# connect this repo, Render reads this file, asks for the envVars marked
# `sync: false` below, and deploys. No Dockerfile/build config to hand-enter.
#
# Free tier note: the free plan has no persistent disk, so
# db/*.sqlite3 resets on every redeploy (user accounts and
# auto-discovered companies included). The 10 core seeded companies
# always come back automatically on boot (see app/main.py's lifespan
# hook) -- fine for a demo/portfolio deployment; upgrade to a paid
# instance with a mounted disk (or migrate to a real Postgres, the
# always-intended destination per docs/PLAN.md) before this is anything
# more than that.
services:
  - type: web
    name: biolens-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: anthropic
      # Real secrets -- Render prompts for these once at Blueprint setup
      # time instead of reading a value from this file.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SEC_EDGAR_CONTACT_EMAIL
        sync: false
      - key: PUBMED_CONTACT_EMAIL
        sync: false
      # Where the BioLens website is hosted (e.g.
      # https://biolens.vercel.app) -- the only browser origin allowed to
      # call this API. Enter `*` on first setup if the website isn't
      # deployed yet, then come back and replace it with the real URL.
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # Render can generate a random value for this one itself -- nothing
      # to type in.
      - key: JWT_SECRET
        generateValue: true
      # --- Persistent storage (recommended; see README "Scans without your
      # laptop"). Without a disk, the signal history, impact calls, track
      # record, accounts and added companies reset on every deploy. Disks
      # need a paid instance: change `plan: free` above (e.g. to `starter`),
      # then uncomment these three and the `disk:` block below.
      # - key: COMPANY_DB_PATH
      #   value: /var/data/biolens_companies.sqlite3
      # - key: SIGNAL_DB_PATH
      #   value: /var/data/biolens_signals.sqlite3
      # - key: USER_DB_PATH
      #   value: /var/data/biolens_users.sqlite3
    # disk:
    #   name: biolens-data
    #   mountPath: /var/data
    #   sizeGB: 1
