<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>BioLens — biotech research, translated for investors</title>
    <meta
      name="description"
      content="BioLens tracks clinical trials, new papers, and SEC filings across biotech companies and explains what each one means — evidence strength, competitors, cash runway, and valuation."
    />
    <meta name="theme-color" content="#060708" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BioLens" />
    <meta
      property="og:description"
      content="Clinical trials, papers, and SEC filings across biotech — explained for investors."
    />
    <meta name="twitter:card" content="summary" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* Matches colors.background so there's no white flash before the
           JS bundle paints the app. */
        background-color: #060708;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>BioLens needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
  </body>
</html>
